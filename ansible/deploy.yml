- name: Deploy ProTask App
  hosts: protask
  become: yes

  tasks:

    - name: Ensure git installed
      apt:
        name: git
        state: present
        update_cache: yes

    - name: Ensure docker running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Fix repo conflicts (clean old files)
      shell: |
        cd /home/ubuntu/html-js-node-mongo-app || exit
        git fetch origin
        git reset --hard origin/main
        git clean -fd

    - name: Pull latest code
      shell: |
        cd /home/ubuntu/html-js-node-mongo-app
        git pull origin main

    - name: Rebuild and restart app
      shell: |
        cd /home/ubuntu/html-js-node-mongo-app/deploy
        docker compose down
        docker compose build --no-cache
        docker compose up -d

    - name: Cleanup unused docker images
      shell: |
        docker system prune -af
